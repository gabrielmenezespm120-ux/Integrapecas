<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="FastQuote">
<style>
  .r { fill: none; stroke: #F5B700; stroke-width: 4; stroke-linecap: round; animation: vento .9s linear infinite; }
  .r2 { animation-delay: -.3s; } .r3 { animation-delay: -.6s; }
  .corpo { animation: corre .45s ease-in-out infinite alternate; }
  .raio { animation: faisca 2.4s infinite; }
  @keyframes vento { 0% { transform: translateX(6px); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateX(-7px); opacity: 0; } }
  @keyframes corre { from { transform: translateY(.8px); } to { transform: translateY(-1.2px); } }
  @keyframes faisca { 0%, 88%, 100% { opacity: 1; } 92% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<path class="r r1" d="M2 24 H14"/><path class="r r2" d="M5 33 H13"/><path class="r r3" d="M2 42 H11"/>
<g class="corpo"><g transform="translate(10 0) skewX(-12)">
  <path d="M19 6 H43 L55 18 V58 H19 Z" fill="#15202B" stroke="#15202B" stroke-width="2" stroke-linejoin="round"/>
  <path d="M43 6 V18 H55 Z" fill="#FFFFFF"/>
  <path class="raio" d="M39 15 L26 36 H35 L31 53 L46 30 H37 L41 15 Z" fill="#F5B700"/>
</g></g>
</svg>
