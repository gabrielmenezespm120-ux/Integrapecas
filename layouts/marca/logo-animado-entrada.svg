<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="QuoteDesk">
<style>
  .r { fill: none; stroke: #F5B700; stroke-width: 4; stroke-linecap: round; transform-box: fill-box; transform-origin: right center; animation: estica 1.1s ease-out both; }
  .r2 { animation-delay: .07s; } .r3 { animation-delay: .14s; }
  .corpo { animation: entra 1s cubic-bezier(.2, .9, .3, 1.25) both; }
  .raio { transform-box: fill-box; transform-origin: center; animation: acende .5s ease-out .85s both; }
  @keyframes entra { 0% { transform: translateX(-46px); opacity: 0; } 50% { opacity: 1; } 100% { transform: none; opacity: 1; } }
  @keyframes estica { 0% { opacity: 0; transform: translateX(-30px) scaleX(2.6); } 55% { opacity: 1; transform: translateX(0) scaleX(2); } 100% { opacity: 1; transform: none; } }
  @keyframes acende { 0% { opacity: .2; transform: scale(.6); } 60% { opacity: 1; transform: scale(1.22); } 100% { transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
