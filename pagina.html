<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastQuote</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --tx:#1b1f24; --mut:#5b6470; --bd:#d5dae1; --ac:#1f6feb; --ok:#1a7f37; --er:#cf222e; --warn:#9a6700; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1216; --card:#181c22; --tx:#e6e9ee; --mut:#9aa4b2; --bd:#2d333b; --ac:#4c8dff; --ok:#3fb950; --er:#ff6b6b; --warn:#d29922; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:16px/1.45 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.sub { color:var(--mut); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:16px; margin-bottom:16px; }
  #zona { border:2px dashed var(--bd); border-radius:10px; padding:28px 12px; text-align:center; cursor:pointer; color:var(--mut); }
  #zona.ativa { border-color:var(--ac); color:var(--tx); }
  #zona strong { color:var(--tx); display:block; margin-bottom:4px; }
  textarea { width:100%; min-height:90px; margin-top:12px; padding:10px; border:1px solid var(--bd); border-radius:8px; background:transparent; color:var(--tx); font:inherit; }
  button { width:100%; margin-top:12px; padding:14px; border:0; border-radius:10px; background:var(--ac); color:#fff; font:600 1rem system-ui, sans-serif; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .link { background:none; color:var(--ac); padding:6px 0; width:auto; font-weight:500; }
  #status { margin-top:12px; }
  .ok { color:var(--ok); font-weight:600; } .er { color:var(--er); font-weight:600; }
  ul.avisos { margin:8px 0 0; padding-left:20px; color:var(--warn); }
  details summary { cursor:pointer; color:var(--mut); }
  input[type=file] { margin-top:10px; max-width:100%; }
</style>
</head>
<body>
<main>
  <h1>FastQuote</h1>
  <p class="sub">Mande o pedido do cliente e receba o orçamento pronto em Excel.</p>

  <section class="card">
    <div id="zona" role="button" tabindex="0" aria-describedby="dica">
      <strong id="nome">Toque para escolher o arquivo</strong>
      <span id="dica">ou arraste aqui, ou cole um print (Ctrl+V). Foto, PDF, planilha ou áudio.</span>
    </div>
    <input id="arquivo" type="file" hidden accept="image/*,application/pdf,audio/*,.xlsx,.csv,.opus,.ogg,.m4a">
    <label for="texto" style="display:block;margin-top:12px;color:var(--mut)">Ou cole o texto do pedido:</label>
    <textarea id="texto" placeholder="Ex.: 2 filtro de óleo FLT-1001, 4 rolamento 6205"></textarea>
    <button id="gerar">Gerar orçamento</button>
    <div id="status" aria-live="polite"></div>
  </section>

  <details class="card">
    <summary>Atualizar estoque e preços (só gerente)</summary>
    <input id="estoque" type="file" accept=".xlsx,.csv" aria-label="Relatório de estoque">
    <button id="enviarEstoque">Enviar relatório de estoque</button>
    <div id="statusEstoque" aria-live="polite"></div>
  </details>
</main>
<script>
const $ = id => document.getElementById(id);
let arquivo = null;

function escolher(f) {
  arquivo = f || null;
  $("nome").textContent = arquivo ? arquivo.name || "print colado" : "Toque para escolher o arquivo";
  $("zona").classList.toggle("ativa", !!arquivo);
}
$("zona").onclick = () => $("arquivo").click();
$("zona").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("arquivo").click(); } };
$("arquivo").onchange = e => escolher(e.target.files[0]);
$("zona").ondragover = e => { e.preventDefault(); $("zona").classList.add("ativa"); };
$("zona").ondragleave = () => escolher(arquivo);
$("zona").ondrop = e => { e.preventDefault(); escolher(e.dataTransfer.files[0]); };
document.onpaste = e => {
  const f = [...e.clipboardData.files][0];
  if (f) { e.preventDefault(); escolher(new File([f], f.name || "print.png", { type: f.type })); }
};

async function enviar(rota, corpo, tipo, nome) {
  // origin sem usuário:senha: o fetch recusa endereço com credenciais (ex.: http://joao:senha@servidor/)
  return fetch(location.origin + rota, { method: "POST", body: corpo,
    headers: { "Content-Type": tipo || "application/octet-stream", "X-Arquivo": encodeURIComponent(nome || "") } });
}

function mostrar(alvo, classe, texto, avisos) {
  alvo.innerHTML = "";
  const p = document.createElement("div");
  p.className = classe; p.textContent = texto; alvo.append(p);
  if (avisos && avisos.length) {
    const t = document.createElement("div"); t.textContent = "Conferir:"; t.style.marginTop = "8px";
    const ul = document.createElement("ul"); ul.className = "avisos";
    avisos.forEach(a => { const li = document.createElement("li"); li.textContent = a; ul.append(li); });
    alvo.append(t, ul);
  }
}

$("gerar").onclick = async () => {
  const texto = $("texto").value.trim();
  if (!arquivo && !texto) return mostrar($("status"), "er", "Escolha um arquivo ou cole o texto do pedido.");
  const botao = $("gerar");
  botao.disabled = true; botao.textContent = "Lendo o pedido…";
  $("status").textContent = "";
  try {
    const r = arquivo ? await enviar("/orcamento", arquivo, arquivo.type, arquivo.name)
                      : await enviar("/orcamento", texto, "text/plain; charset=utf-8", "");
    if (!r.ok) return mostrar($("status"), "er", await r.text());
    const blob = await r.blob();
    const nome = (r.headers.get("Content-Disposition") || "").match(/filename="(.+)"/)?.[1] || "orcamento.xlsx";
    const avisos = JSON.parse(decodeURIComponent(r.headers.get("X-Avisos") || "%5B%5D"));
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement("a"), { href: url, download: nome });
    a.click();
    mostrar($("status"), "ok", `Pronto: ${r.headers.get("X-Itens")} itens. Confira antes de enviar ao cliente.`, avisos);
    const de_novo = Object.assign(document.createElement("a"), { href: url, download: nome, textContent: "Baixar de novo" });
    de_novo.className = "link"; $("status").append(de_novo);
    escolher(null); $("arquivo").value = ""; $("texto").value = "";
  } catch (e) {
    mostrar($("status"), "er", "Sem conexão com o servidor. Tente de novo.");
  } finally {
    botao.disabled = false; botao.textContent = "Gerar orçamento";
  }
};

$("enviarEstoque").onclick = async () => {
  const f = $("estoque").files[0];
  if (!f) return mostrar($("statusEstoque"), "er", "Escolha o relatório de estoque.");
  const botao = $("enviarEstoque"); botao.disabled = true;
  try {
    const r = await enviar("/estoque", f, f.type, f.name);
    mostrar($("statusEstoque"), r.ok ? "ok" : "er", await r.text());
  } catch (e) {
    mostrar($("statusEstoque"), "er", "Sem conexão com o servidor. Tente de novo.");
  } finally { botao.disabled = false; }
};
</script>
</body>
</html>
